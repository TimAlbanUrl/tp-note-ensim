<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-2">
    <div class="flex gap-2">
        <label for="name">Nom:</label>
        <input formControlName="name" id="name" type="text" class="border border-zinc-200 inset-shadow-sm rounded-md">
    </div>
    <div class="flex gap-2">
        <label for="description">Description:</label>
        <input formControlName="description" id="description" type="text" class="border border-zinc-200 inset-shadow-sm rounded-md">
    </div>
    <div class="flex gap-2">
        <label for="hp">Points de vie:</label>
        <input formControlName="hp" id="hp" type="number" class="border border-zinc-200 inset-shadow-sm rounded-md">
    </div>
    <div class="flex gap-2">
        <label for="strength">Force:</label>
        <input formControlName="strength" id="strength" type="number" class="border border-zinc-200 inset-shadow-sm rounded-md">
    </div>
    <div class="flex gap-2">
        <label for="speed">Vitesse:</label>
        <input formControlName="speed" id="speed" type="number" class="border border-zinc-200 inset-shadow-sm rounded-md">
    </div>
    <button
        [disabled]="form.invalid" type="submit"
        class="cursor-pointer px-2 py-1 rounded-md border border-zinc-200 disabled:bg-zinc-100 disabled:cursor-not-allowed disabled:text-zinc-600"
    >Créer</button>
</form>
