<h2>{{ kitsune().name }}</h2>
<p>Description: {{ kitsune().description }}</p>
<p>Points de vie: {{ kitsune().hp }}</p>
<p>Force: {{ kitsune().strength }}</p>
<p>Vitesse: {{ kitsune().speed }}</p>
<p>En repos: {{ kitsune().isResting }}</p>
<p>Nombre de victoires: {{ kitsune().wins }}</p>
<p>Boosté: {{ kitsune().boost }}</p>
<button
    (click)="handleBoostAttempt()"
    [disabled]="kitsune().boost || kitsune().boostAttemptsLeft == 0"
    class="cursor-pointer px-2 py-1 rounded-md border border-zinc-200 disabled:bg-zinc-100 disabled:cursor-not-allowed disabled:text-zinc-600"
>
    Booster
</button>
